spring.application.name=Goliath-License-API

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goliath}
spring.datasource.username=${DB_USER:goliath}
spring.datasource.password=${DB_PASSWORD:goliath}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.time-zone=UTC
server.port=8080
# Disable devtools restart to avoid an automatic restart that can cause Gradle to report a non-zero JVM exit
spring.devtools.restart.enabled=false
